<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="420" rx="18" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <text x="560" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    MacOS OpenBooklet — Clean-Room Rust + Native Quartz 2D Vector PDF Architecture
  </text>
  <text x="560" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" text-anchor="middle">
    100% Vector Preservation (Zero Rasterization) · ISO 32000-1 Prepress Boxes · Sub-Millimeter Duplex Calibration
  </text>

  <!-- Stage 1: Source PDF & Prepress Box Inspector -->
  <rect x="34" y="92" width="230" height="288" rx="12" fill="url(#cardCore)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="34" y="92" width="230" height="34" rx="12" fill="url(#accentSky)"/>
  <text x="149" y="114" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    1. Source PDF &amp; 5-Box Inspector
  </text>
  <text x="52" y="150" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="600">CGPDFDocument / CGPDFPage</text>
  <text x="52" y="176" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">• MediaBox (Raw Sheet Size)</text>
  <text x="52" y="198" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">• TrimBox (Finished Cut Edge)</text>
  <text x="52" y="220" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">• BleedBox (3–5 mm Print Bleed)</text>
  <text x="52" y="242" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">• CropBox &amp; ArtBox</text>
  <text x="52" y="264" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">• Page Rotation (/Rotate 0–270°)</text>
  <rect x="50" y="286" width="198" height="74" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="149" y="308" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">Auto Box Resolution</text>
  <text x="149" y="328" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5" text-anchor="middle">TrimBox → CropBox → MediaBox</text>
  <text x="149" y="346" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">+ Front / Back Blank Flyleaves</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="264" y1="236" x2="296" y2="236" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="296,230 308,236 296,242" fill="#38bdf8"/>

  <!-- Stage 2: openbooklet-core (Pure Rust Engine) -->
  <rect x="310" y="92" width="265" height="288" rx="12" fill="url(#cardCore)" stroke="#34d399" stroke-width="1.5"/>
  <rect x="310" y="92" width="265" height="34" rx="12" fill="url(#accentEmerald)"/>
  <text x="442" y="114" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    2. openbooklet-core (Pure Rust)
  </text>
  <text x="328" y="150" fill="#34d399" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">12 Imposition &amp; Prepress Schemas</text>
  <text x="328" y="174" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• Saddle-Stitch Single Booklet</text>
  <text x="328" y="195" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• Multi-Signature Sewn / Glued Books</text>
  <text x="328" y="216" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">• Guillotine Cut &amp; Stack (2-Up &amp; 4-Up)</text>
  <text x="328" y="237" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">• De-Impose Booklet / Split 2-Up</text>
  <text x="328" y="258" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• 2-Up, 4-Up Grid, Step &amp; Repeat</text>
  <rect x="326" y="278" width="233" height="82" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="442" y="299" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">Precision Affine Matrix Solver</text>
  <text x="442" y="319" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Creep Shingling: Δx(s) = C · s / (M − 1)</text>
  <text x="442" y="337" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Verso Duplex Calibration: (+dX, +dY mm)</text>
  <text x="442" y="353" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">RTL (Manga/Arabic) · Calendar 180° Flip</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="575" y1="236" x2="607" y2="236" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="607,230 619,236 607,242" fill="#34d399"/>

  <!-- Stage 3: openbooklet-pdf (Quartz 2D Vector Renderer) -->
  <rect x="621" y="92" width="235" height="288" rx="12" fill="url(#cardCore)" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="621" y="92" width="235" height="34" rx="12" fill="#4f46e5"/>
  <text x="738" y="114" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    3. openbooklet-pdf (Quartz 2D)
  </text>
  <text x="639" y="150" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">Vector PDF &amp; Prepress Marks</text>
  <text x="639" y="176" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• Native CGPDFContext DrawPDFPage</text>
  <text x="639" y="198" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• Perimeter Corner Crop Marks</text>
  <text x="639" y="220" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• Bullseye Registration Targets</text>
  <text x="639" y="242" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">• Stepped Spine Collating Marks</text>
  <text x="639" y="264" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• CoreText Folio Numbering &amp; Slug</text>
  <rect x="637" y="286" width="203" height="74" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="738" y="308" fill="#f43f5e" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">Duplex Calibration Sheet</text>
  <text x="738" y="328" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">2-Page Printable Vernier Target</text>
  <text x="738" y="346" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">±15 mm Front/Back Light Test</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="856" y1="236" x2="888" y2="236" stroke="#818cf8" stroke-width="2.5"/>
  <polygon points="888,230 900,236 888,242" fill="#818cf8"/>

  <!-- Stage 4: Native AppKit GUI & CLI -->
  <rect x="902" y="92" width="184" height="288" rx="12" fill="url(#cardCore)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="902" y="92" width="184" height="34" rx="12" fill="#d97706"/>
  <text x="994" y="114" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    4. AppKit GUI &amp; CLI
  </text>
  <text x="918" y="154" fill="#fde68a" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">OpenBooklet.app</text>
  <text x="918" y="176" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• Live Retina PDFView</text>
  <text x="918" y="196" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• Preflight Diagnostics</text>
  <text x="918" y="216" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• Native Print (Cmd+P)</text>

  <line x1="918" y1="238" x2="1070" y2="238" stroke="#334155" stroke-width="1"/>

  <text x="918" y="264" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">openbooklet CLI</text>
  <text x="918" y="286" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• --mode / --duplex-offset</text>
  <text x="918" y="306" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• --dry-run &amp; --json</text>
  <text x="918" y="326" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• calibrate-sheet</text>
  <text x="918" y="346" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• deimpose &amp; inspect</text>
</svg>
